name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontmatter:
    name: Skill frontmatter YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate:frontmatter
